[package]
name = "gsfit_rs"
version = "0.0.10"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "gsfit_rs"

[dependencies]
# Local dependency
imas_rs = { path = "../imas_rs", features = ["python"] }  # "python" = expose the data dictionary as the `gsfit_rs.imas` submodule
interpolation = { path = "../interpolation" }
npy_reader_and_writer = { path = "../npy_reader_and_writer" }

# External dependencies
diffsol = "0.17.1"
geo = "0.33.1"  # For centre of mass; polygon area
pyo3 = { version = "0.30.1", features = ["extension-module", "multiple-pymethods"] }  # "extension-module" = this will be a Python package; "multiple-pymethods" = allow more than one `#[pymethods]` impl block per `#[pyclass]` struct, needed because each file of `magnetic_sensors/` adds its own block to `Magnetics`, and `plasma_current_components_python_interface.rs` has two
physical_constants = "0.5.0"  # For MU_0
rayon = "1.12.0"
spec_math = "0.1.6"  # For elliptic integrals
numpy = "0.30.0"
ndarray = { version = "0.17.2", features = ["approx"] }  # must be same version as numpy uses internally
ndarray-interp = "0.6.0"  # TODO: I want to remove this dependency, because it has essentially been abandoned and it restricts `ndarray` version!
env_logger = "0.11.11"
log = "0.4.34"
approx = "0.5.1"
faer = "0.24.4"
ndarray-stats = "0.7.0"  # TODO: I want to remove this dependency, because it restricts `ndarray` version!
rand = "0.10.2"
roxmltree = "0.21.1"  # For reading the settings from XML into structs
rustfft = "6.4.1"  # For the FFTs of the lattice series products, in the Buxton-Prokopyszyn analytic solution
special = "0.14.1" # "special" mathematical functions, used for `Lambert`
oxml = "0.0.13"  # For parsing the settings' XML for `xmlschema`; must be same version as `xmlschema` uses internally
xmlschema = "0.0.14"  # For validating the settings' XML against their XML schema

[build-dependencies]
# Used in `build.rs` to discover the Python interpreter (uv, venv, conda, or system Python)
# with the same logic pyo3 itself uses; must be the same version as `pyo3`
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }

[lints.clippy]
needless_range_loop = "allow"
