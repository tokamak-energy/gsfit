[package]
name = "imas_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.17.2"
num-complex = "0.4.6"

# Only needed by the `python` feature, which adds the Python bindings in `src/python/`.
# Kept optional so `imas_rs` stays a plain Rust crate by default.
numpy = { version = "0.29.0", optional = true }  # must be the same version as `gsfit_rs` uses
pyo3 = { version = "0.29.0", optional = true }  # must be the same version as `gsfit_rs` uses

[features]
# Expose the data dictionary to Python. `gsfit_rs` enables this and mounts the
# resulting classes as the `gsfit_rs.imas` submodule.
python = ["dep:numpy", "dep:pyo3"]

# Index-based for loops are the house style (see `documentation/gsfit_coding_standards.md`)
[lints.clippy]
needless_range_loop = "allow"
